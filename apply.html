<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit Agency — Training Application</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Intl-Tel-Input for WhatsApp Flags -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>

  <style>
    :root {
      --bg-pure: #000000;
      --bg-elevated: #07090e;
      --accent-blue: #3772FF;
      --border-subtle: rgba(255, 255, 255, 0.12);
      --text-white: #ffffff;
      --text-grey: #a1a1aa;
    }
    body {
      background-color: var(--bg-pure);
      color: var(--text-white);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top center, rgba(55, 114, 255, 0.15), transparent 60%), var(--bg-pure);
    }
    .form-container {
      background: rgba(10, 14, 22, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      margin: 40px 20px;
      box-shadow: 0 10px 40px rgba(55, 114, 255, 0.1);
      backdrop-filter: blur(12px);
    }
    .header-text { text-align: center; margin-bottom: 32px; }
    .header-text h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.8rem; margin: 0 0 10px; color: var(--text-white); }
    .header-text p { color: var(--text-grey); font-size: 0.95rem; margin: 0; }
    .form-group { margin-bottom: 22px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; color: #d4d4d8; }
    
    input[type="text"], input[type="email"], select {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-subtle);
      color: var(--text-white);
      padding: 14px 16px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-sizing: border-box;
      appearance: none;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(55, 114, 255, 0.25);
    }
    select {
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a1a1aa%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 16px top 50%;
      background-size: 10px auto;
    }
    select option { background: #07090e; color: #fff; }
    
    .iti { width: 100%; } /* WhatsApp Input Fix */
    .iti__country-list { background-color: #07090e; border: 1px solid var(--border-subtle); color: #fff; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    /* Checkbox & Radio */
    .radio-group { display: flex; flex-direction: column; gap: 10px; }
    .radio-label {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 0.9rem; color: var(--text-grey); cursor: pointer;
      background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px;
      border: 1px solid var(--border-subtle); transition: all 0.2s;
    }
    .radio-label:hover { border-color: rgba(55,114,255,0.5); }
    .radio-label input { margin-top: 3px; cursor: pointer; accent-color: var(--accent-blue); }
    
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #3772FF 0%, #1D4ED8 100%);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(55, 114, 255, 0.3);
      transition: all 0.3s;
      margin-top: 10px;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(55, 114, 255, 0.5); }
    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    
    #success-message {
      display: none; text-align: center; color: #4ade80; padding: 20px;
      background: rgba(74, 222, 128, 0.1); border-radius: 12px; border: 1px solid rgba(74, 222, 128, 0.3);
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="header-text">
      <h1>Free Agent Training Program</h1>
      <p>Join the Orbit Agency US Real Estate cohort.</p>
    </div>

    <!-- SUCCESS MESSAGE -->
    <div id="success-message">
      <h3 style="margin-top:0;">Application Submitted Successfully!</h3>
      <p style="margin-bottom:0;">We will contact you via WhatsApp soon.</p>
    </div>

    <!-- FORM -->
    <form id="orbitForm">
      
      <div class="form-group">
        <label>Full Name (in English)</label>
        <input type="text" name="FullName" required placeholder="e.g. Ahmed Ali">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="Email" required placeholder="your@email.com">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>WhatsApp Number</label>
          <input type="tel" id="whatsapp" required>
          <input type="hidden" name="WhatsApp" id="whatsapp-full">
        </div>
        <div class="form-group">
          <label>Nationality</label>
          <input type="text" name="Nationality" required placeholder="e.g. Sudanese">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Residence Country</label>
          <select id="countrySelect" name="Country" required onchange="populateCities()">
            <option value="" disabled selected>Select Country</option>
            <option value="Sudan">Sudan</option>
            <option value="Egypt">Egypt</option>
            <option value="Saudi Arabia">Saudi Arabia</option>
            <option value="UAE">UAE</option>
            <option value="Qatar">Qatar</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>City</label>
          <select id="citySelect" name="City" required>
            <option value="" disabled selected>Select City</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>English Proficiency Level</label>
        <select name="EnglishLevel" required>
          <option value="" disabled selected>Select Level</option>
          <option value="A1/A2 (Beginner)">A1 / A2 (Beginner)</option>
          <option value="B1 (Intermediate)">B1 (Intermediate)</option>
          <option value="B2 (Upper-Intermediate)">B2 (Upper-Intermediate)</option>
          <option value="C1 (Advanced)">C1 (Advanced)</option>
          <option value="C2 / Native">C2 / Native</option>
        </select>
      </div>

      <div class="form-group">
        <label>Previous Cold Calling / Sales Experience</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="Experience" value="US Real Estate Cold Calling" required>
            Experienced in US Real Estate Cold Calling
          </label>
          <label class="radio-label">
            <input type="radio" name="Experience" value="Other Telemarketing">
            Experienced in other Telemarketing / Call Center roles
          </label>
          <label class="radio-label">
            <input type="radio" name="Experience" value="No Experience">
            No prior experience (Fast learner)
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Current Hardware Setup</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="Hardware" value="Laptop + Headset" required>
            I have a Laptop/PC + Headset (Ready to work)
          </label>
          <label class="radio-label">
            <input type="radio" name="Hardware" value="Laptop Only">
            I have a Laptop/PC (No Headset currently)
          </label>
          <label class="radio-label">
            <input type="radio" name="Hardware" value="Smartphone Only">
            Joining from Smartphone for now
          </label>
        </div>
      </div>

      <div class="form-group" style="margin-top: 30px;">
        <label class="radio-label" style="border-color: rgba(55, 114, 255, 0.4);">
          <input type="checkbox" name="FacebookFollow" value="Yes" required>
          I confirm that I have followed the official Orbit-Agency Facebook page to activate my free training seat.
        </label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Application →</button>
    </form>
  </div>

  <script>
    // 1. Initialize WhatsApp Dropdown
    const phoneInputField = document.querySelector("#whatsapp");
    const phoneInput = window.intlTelInput(phoneInputField, {
      preferredCountries: ["sd", "eg", "sa", "ae", "qa"],
      utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js",
    });

    // 2. Cascade Country/City Logic
    const citiesData = {
      "Sudan": ["Khartoum", "Omdurman", "Port Sudan", "Kassala", "Madani", "Other"],
      "Egypt": ["Cairo", "Alexandria", "Giza", "Mansoura", "Other"],
      "Saudi Arabia": ["Riyadh", "Jeddah", "Mecca", "Dammam", "Other"],
      "UAE": ["Dubai", "Abu Dhabi", "Sharjah", "Other"],
      "Qatar": ["Doha", "Al Rayyan", "Other"],
      "Other": ["Type manually in the form notes or select Other"]
    };

    function populateCities() {
      const country = document.getElementById("countrySelect").value;
      const citySelect = document.getElementById("citySelect");
      citySelect.innerHTML = '<option value="" disabled selected>Select City</option>';
      if (citiesData[country]) {
        citiesData[country].forEach(city => {
          let option = document.createElement("option");
          option.value = city; option.text = city;
          citySelect.appendChild(option);
        });
      } else {
        let option = document.createElement("option");
        option.value = "Other"; option.text = "Other";
        citySelect.appendChild(option);
      }
    }

    // 3. Handle Form Submission directly to Google Sheets
    const form = document.getElementById('orbitForm');
    
    // 🔥 استبدل هذا الرابط بالرابط الخاص بك (Web App URL) من جوجل شيت 🔥
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzDeJBjKHI2yX2DRz77W1t_AORLhdFBWgWRHky5glSO8YxCp2TblhwuxXg0t-00cLPfHw/exec'; 

    form.addEventListener('submit', e => {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Submitting...';
      btn.disabled = true;

      // Extract full WhatsApp number with country code
      document.getElementById('whatsapp-full').value = phoneInput.getNumber();

      // Send Data
      fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => {
          form.style.display = 'none';
          document.getElementById('success-message').style.display = 'block';
        })
        .catch(error => {
          console.error('Error!', error.message);
          btn.innerText = 'Error. Try Again.';
          btn.disabled = false;
        });
    });
  </script>
</body>
</html>
